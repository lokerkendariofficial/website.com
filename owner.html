<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pemilik - Loker Kendari</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top-bar">
  <span><i class="fas fa-crown"></i> Dashboard Pemilik</span>
  <button onclick="location.href='index.html'">Kembali ke Pilihan Peran</button>
</div>
<div class="dashboard-container">
  <aside class="sidebar">
    <a href="#" onclick="loadContent('beranda')">🏠 Beranda</a>
    <a href="#" onclick="loadContent('pasang')">📝 Pasang Iklan</a>
    <a href="#" onclick="loadContent('profil')">👤 Profil</a>
    <a href="#" onclick="loadContent('kontak')">📧 Kontak</a>
    <a href="#" onclick="loadContent('konfirmasi')">✅ Konfirmasi Iklan</a>
    <a href="#" onclick="loadContent('kelola-user')">👥 Kelola User</a>
    <a href="#" onclick="loadContent('laporan')">📊 Laporan</a>
    <a href="#" onclick="loadContent('pengaturan')">⚙️ Pengaturan Sistem</a>
  </aside>
  <div class="content" id="mainContent">
    <!-- Konten akan dimuat di sini -->
    <div id="jobList" class="job-grid"></div>
    <div id="jobCountDisplay" style="text-align:center; margin-bottom:1rem;"></div>
  </div>
</div>

<!-- Modal (sama seperti sebelumnya) -->
<div id="detailModal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2><i class="fas fa-briefcase"></i> Detail Lowongan</h2>
      <button class="modal-close" id="closeModalBtn">&times;</button>
    </div>
    <div class="modal-body" id="modalBody">Memuat...</div>
  </div>
</div>

<script src="script.js"></script>
<script>
  let currentContent = 'beranda';
  function loadContent(page) {
    currentContent = page;
    if (page === 'beranda') {
      renderJobs();
      document.getElementById('jobCountDisplay').style.display = 'block';
    } else if (page === 'pasang') {
      // Tampilkan form pasang iklan (bisa dibuat terpisah)
      document.getElementById('jobList').innerHTML = `<div class="container"><h2>Form Pasang Iklan</h2><form id="postForm">...</form></div>`;
    } else {
      document.getElementById('jobList').innerHTML = `<div class="container"><h2>Halaman ${page}</h2><p>Konten sedang dikembangkan.</p></div>`;
    }
  }
  // Inisialisasi
  initJobsData();
  renderJobs();
  // Modal event listener (sama seperti sebelumnya)
  const modal = document.getElementById('detailModal');
  const closeBtn = document.getElementById('closeModalBtn');
  closeBtn.onclick = () => modal.classList.remove('active');
  modal.onclick = (e) => { if(e.target === modal) modal.classList.remove('active'); };
</script>
</body>
</html>
