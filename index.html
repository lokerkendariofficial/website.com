<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loker Kendari - Pilih Peran</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="container" style="text-align: center;">
  <div class="header">
    <h1>LokerKendari</h1>
    <p>Pilih peran Anda untuk melanjutkan</p>
  </div>
  <div class="role-selection">
    <div class="role-card owner" onclick="location.href='owner/owner.html'">
      <i class="fas fa-crown"></i>
      <h3>👑 Pemilik</h3>
      <small>Akses penuh</small>
    </div>
    <div class="role-card admin" onclick="location.href='admin/admin.html'">
      <i class="fas fa-tools"></i>
      <h3>🔧 Admin</h3>
      <small>Akses terbatas</small>
    </div>
    <div class="role-card user" onclick="location.href='user/user.html'">
      <i class="fas fa-user"></i>
      <h3>👤 User</h3>
      <small>Akses dasar</small>
    </div>
  </div>
  <div class="footer" style="margin-top: 4rem;">
    © 2026 Loker Kendari Official
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
