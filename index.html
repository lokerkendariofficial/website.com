<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Loker Kendari Official</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #0a5b8c 0%, #0e7490 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 32px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.2);
    }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo h1 { color: #0a5b8c; font-size: 1.8rem; }
    .logo p { color: #555; font-size: 0.8rem; }
    .form-group { margin-bottom: 1rem; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 40px;
      font-size: 1rem;
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0a5b8c;
      color: white;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }
    .error { color: #dc2626; font-size: 0.8rem; margin-top: 0.5rem; text-align: center; }
    .info { text-align: center; font-size: 0.7rem; color: #777; margin-top: 1rem; }
  </style>
  <script src="auth/config.js"></script>
  <script src="auth/session.js"></script>
  <script src="auth/rules.js"></script>
  <script src="auth/security.js"></script>
  <script src="auth/account.js"></script>
  <script src="auth/guard.js"></script>
  <script src="auth/init.js"></script>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <h1>Loker Kendari</h1>
    <p>Official • Lowongan Kerja Terpercaya</p>
  </div>
  <div class="form-group">
    <input type="text" id="loginId" placeholder="ID (900900/9090/9091)" autocomplete="off">
  </div>
  <div class="form-group">
    <input type="password" id="password" placeholder="Password">
  </div>
  <button id="loginBtn">Masuk</button>
  <div id="error" class="error"></div>
  <div class="info">Pendaftar pertama otomatis menjadi PEMILIK</div>
</div>
<script>
  document.getElementById('loginBtn').onclick = () => {
    const id = document.getElementById('loginId').value.trim();
    const pass = document.getElementById('password').value;
    if (!id || !pass) {
      document.getElementById('error').innerText = 'Harap isi semua field.';
      return;
    }
    const res = loginUnique(id, pass);
    if (res.success) {
      window.location.href = 'dashboard.html';
    } else {
      document.getElementById('error').innerText = res.msg;
    }
  };
</script>
</body>
</html>
