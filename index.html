<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loker Kendari Official - Beranda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>LokerKendari</h1>
        <p>Lowongan kerja terpercaya di Sulawesi Tenggara</p>
    </div>

    <div class="role-buttons">
        <button id="btnOwner" class="role-btn owner">👑 Pemilik</button>
        <button id="btnAdmin" class="role-btn admin">🔧 Admin</button>
        <button id="btnUser" class="role-btn user">👤 User</button>
    </div>

    <div class="search-wrapper">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari judul atau perusahaan...">
            <button id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
    </div>

    <div class="categories" id="categoriesContainer"></div>
    <div class="job-count" id="jobCountDisplay">Memuat lowongan...</div>
    <div class="job-grid" id="jobList"></div>

    <div class="footer">
        &copy; 2026 Loker Kendari Official - Portal Lowongan Kerja
    </div>
</div>
<script src="script.js"></script>
</body>
  </html>
