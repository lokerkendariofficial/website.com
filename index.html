<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Loker Kendari - Lowongan Kerja</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="fab.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Loker Kendari Official</h1>
  </div>

  <div class="search-wrapper">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari judul atau perusahaan...">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
  </div>

  <div class="categories" id="categoriesContainer"></div>
  <div class="job-count" id="jobCountDisplay">Memuat lowongan...</div>
  <div class="job-grid" id="jobList"></div>

  <div class="footer">© 2026 Loker Kendari Official - Portal Lowongan Kerja</div>
</div>

<!-- Modal detail lowongan -->
<div id="detailModal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2><i class="fas fa-briefcase"></i> Detail Lowongan</h2>
      <button class="modal-close" id="closeModalBtn">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Tempat untuk FAB -->
<div id="fabPlaceholder"></div>

<script src="script.js"></script>
<script src="fab.js"></script>
<script>
  // Memuat fab.html ke dalam #fabPlaceholder
  fetch('fab.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('fabPlaceholder').innerHTML = html;
      // Setelah konten dimuat, jalankan kembali inisialisasi fab.js (karena mungkin event listener belum terpasang)
      if (typeof initFab === 'function') initFab();
      else {
        // Atau panggil ulang logika dari fab.js yang sudah ada di global
        const mainBtn = document.getElementById('fabMainBtn');
        const submenu = document.getElementById('fabSubmenu');
        if (mainBtn && submenu) {
          mainBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            submenu.classList.toggle('show');
          });
          document.addEventListener('click', function(event) {
            if (!mainBtn.contains(event.target) && !submenu.contains(event.target)) {
              submenu.classList.remove('show');
            }
          });
        }
      }
    })
    .catch(err => console.error('Gagal memuat FAB:', err));
</script>
</body>
</html>
