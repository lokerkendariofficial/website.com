<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loker Kendari - Portal Lowongan Kerja</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="menu.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
    }
    .iframe-content {
      margin-top: 70px;
      width: 100%;
      height: calc(100vh - 70px);
      border: none;
      background: white;
      display: block;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="logo" id="logo"><i class="fas fa-briefcase"></i> LokerKendari</div>
    <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
    <div class="nav-links" id="navLinks">
      <a href="#" data-page="beranda">Beranda</a>
      <a href="#" data-page="lowongan">Lowongan</a>
      <a href="#" data-page="kontak">Kontak</a>
      <a href="#" data-page="pasang">Pasang Iklan</a>
      <a href="#" data-page="profil">Profil</a>
    </div>
  </div>
</nav>

<iframe src="beranda.html" class="iframe-content" id="contentFrame" title="Konten Utama"></iframe>

<script src="menu.js"></script>
<script>
  // Fungsi navigasi untuk mengganti iframe sesuai halaman yang dipilih
  function navigateTo(page) {
    let src = "";
    if (page === "beranda") src = "beranda.html";
    else if (page === "lowongan") src = "lowongan.html";
    else if (page === "kontak") src = "kontak.html";
    else if (page === "pasang") src = "pasang.html";
    else if (page === "profil") src = "profil.html";
    if (src) {
      document.getElementById("contentFrame").src = src;
    }
  }

  // Event listener untuk menu di navbar
  document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const page = link.getAttribute('data-page');
      navigateTo(page);
    });
  });

  // Event listener untuk logo (kembali ke beranda)
  document.getElementById('logo').addEventListener('click', () => {
    navigateTo('beranda');
  });

  // Meneruskan pesan refreshLowongan ke iframe konten
  window.addEventListener("message", function(event) {
    if (event.data && event.data.type === "refreshLowongan") {
      const frame = document.getElementById("contentFrame");
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type: "refreshLowongan" }, "*");
      }
    }
    if (event.data && event.data.type === "refreshProfil") {
      const frame = document.getElementById("contentFrame");
      if (frame && frame.contentWindow && frame.src.includes("profil.html")) {
        frame.contentWindow.postMessage({ type: "refreshProfil" }, "*");
      }
    }
  });
</script>
</body>
</html>
