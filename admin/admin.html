<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body { font-family: system-ui; background: #f8fafc; padding: 2rem; text-align: center; }
    .card { background: white; max-width: 600px; margin: 0 auto; padding: 2rem; border-radius: 24px; }
    h1 { color: #2c3e66; }
    button { background: #2c3e66; color: white; border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="card">
  <h1><i class="fas fa-tools"></i> Dashboard Admin</h1>
  <p>Selamat datang, Admin! Anda dapat mengelola lowongan.</p>
  <button onclick="logout()">Logout</button>
</div>
<script src="auth.js"></script>
</body>
</html>
