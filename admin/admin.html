<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Dashboard Admin - Loker Kendari</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <style>
    .dashboard-header { background: #2c3e66; padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
    .hamburger { background: none; border: none; color: white; font-size: 1.8rem; cursor: pointer; }
    .menu-overlay { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: white; transition: left 0.3s; z-index: 1001; overflow-y: auto; }
    .menu-overlay.open { left: 0; }
    .menu-overlay .close-btn { text-align: right; padding: 12px; font-size: 1.5rem; cursor: pointer; }
    .menu-overlay a { display: block; padding: 12px 20px; text-decoration: none; color: #1e293b; border-bottom: 1px solid #e2e8f0; }
    .menu-overlay a:hover { background: #f1f5f9; }
    .backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; }
    .backdrop.show { display: block; }
    .content-area { padding: 20px; }
  </style>
</head>
<body>
<div class="dashboard-header"><button class="hamburger" id="hamburgerBtn">☰</button></div>
<div class="backdrop" id="backdrop"></div>
<div class="menu-overlay" id="menuOverlay">
  <div class="close-btn" id="closeMenuBtn">&times;</div>
  <a href="#" data-page="beranda">🏠 Beranda</a>
  <a href="#" data-page="pasang">📝 Pasang Iklan</a>
  <a href="#" data-page="profil">👤 Profil</a>
  <a href="#" data-page="kontak">📧 Kontak</a>
  <a href="#" data-page="konfirmasi">✅ Konfirmasi Iklan</a>
  <a href="#" data-page="kelola-user">👥 Kelola User</a>
  <a href="#" data-page="laporan">📊 Laporan</a>
  <a href="#" data-page="logout">🚪 Kembali ke Beranda</a>
</div>
<div class="content-area" id="mainContent"><div id="jobList" class="job-grid"></div><div id="jobCountDisplay"></div></div>
<div id="detailModal" class="modal-overlay"><div class="modal-container"><div class="modal-header"><h2>Detail Lowongan</h2><button class="modal-close" id="closeModalBtn">&times;</button></div><div class="modal-body" id="modalBody"></div></div></div>
<script src="../script.js"></script>
<script>
  const hamburger = document.getElementById('hamburgerBtn'), menu = document.getElementById('menuOverlay'), backdrop = document.getElementById('backdrop'), closeMenuBtn = document.getElementById('closeMenuBtn');
  function openMenu() { menu.classList.add('open'); backdrop.classList.add('show'); }
  function closeMenu() { menu.classList.remove('open'); backdrop.classList.remove('show'); }
  hamburger.onclick = openMenu; closeMenuBtn.onclick = closeMenu; backdrop.onclick = closeMenu;
  function loadContent(page) { closeMenu(); if(page==='beranda'){ renderJobs(); } else if(page==='logout'){ window.location='../index.html'; } else { document.getElementById('jobList').innerHTML = `<div class="container"><h2>Halaman ${page}</h2><p>Fitur sedang dikembangkan.</p></div>`; } }
  document.querySelectorAll('.menu-overlay a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault(); loadContent(a.getAttribute('data-page'));}));
  initJobsData(); renderJobs();
  const modal = document.getElementById('detailModal'), closeModalBtn = document.getElementById('closeModalBtn');
  closeModalBtn.onclick = () => modal.classList.remove('active'); modal.onclick = e => { if(e.target===modal) modal.classList.remove('active'); };
</script>
</body>
</html>
