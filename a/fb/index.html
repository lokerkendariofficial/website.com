<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Loker Kendari Official - Pasang Lowongan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>📢 Loker Kendari Official</h2>
    <p class="sub">Data akan tersimpan & muncul di Data Center</p>
    <form id="lokerForm">
        <div class="form-group">
            <label>📧 Email Perusahaan</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>🏢 Nama Perusahaan</label>
            <input type="text" name="perusahaan" required>
        </div>
        <div class="form-group">
            <label>💼 Posisi</label>
            <input type="text" name="posisi" required>
        </div>
        <div class="form-group">
            <label>📍 Lokasi</label>
            <input type="text" name="lokasi" required>
        </div>
        <div class="form-group">
            <label>🛠️ Jenis Pekerjaan</label>
            <select id="jenisSelect">
                <option value="Full-Time">Full-Time</option>
                <option value="Part-Time">Part-Time</option>
                <option value="Kontrak">Kontrak</option>
                <option value="Magang">Magang</option>
                <option value="manual">-- Isi Manual --</option>
            </select>
            <input type="text" id="jenisManual" class="hidden-input" placeholder="Tulis jenis">
        </div>
        <div class="form-group">
            <label>💰 Estimasi Gaji</label>
            <select id="gajiSelect">
                <option value="Tidak disebutkan">Tidak disebutkan</option>
                <option value="Bulanan">Bulanan</option>
                <option value="Mingguan">Mingguan</option>
                <option value="Harian">Harian</option>
                <option value="Persen">Persentase</option>
            </select>
            <input type="text" id="gajiDetail" class="hidden-input" placeholder="Nominal/keterangan">
        </div>
        <div class="form-group">
            <label>📑 Kualifikasi / Deskripsi</label>
            <textarea name="deskripsi" rows="4" required></textarea>
        </div>
        <button type="submit">Kirim Lowongan</button>
    </form>
    <div id="alertBox" class="alert"></div>
    <div style="text-align: center; margin-top: 15px;">
        <a href="https://whatsapp.com/channel/0029VajH5Wu3QxRx0NTwWm0V" target="_blank" rel="noopener noreferrer">loker update</a>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
