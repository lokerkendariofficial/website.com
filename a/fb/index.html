<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pasang Lowongan Kerja - Loker Kendari</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>📢 Pasang Lowongan Kerja</h2>
        <p class="sub-title">Isi data di bawah ini dengan lengkap untuk menerbitkan info loker.</p>
        
        <form id="lokerForm">
            <!-- GANTI access_key dengan key milik Anda dari web3forms.com -->
            <input type="hidden" name="access_key" value="63f5b331-5975-4740-b8c3-300e8fca2012">
            <input type="hidden" name="subject" value="Info Loker Baru Terkirim">
            <input type="hidden" name="from_name" value="Sistem Portal Loker">

            <div class="form-group">
                <label>Nama Perusahaan 🏢</label>
                <input type="text" name="Nama Perusahaan" placeholder="Contoh: PT Sumber Alfaria Trijaya" required>
            </div>

            <div class="form-group">
                <label>Judul / Posisi Pekerjaan 💼</label>
                <input type="text" name="Judul Pekerjaan" placeholder="Contoh: Staff Administrasi Toko" required>
            </div>

            <div class="form-group">
                <label>Jenis / Kebutuhan Kerja 🛠️</label>
                <select id="jenis_kebutuhan" name="Jenis Kebutuhan" required>
                    <option value="" disabled selected>-- Pilih Jenis Kerja --</option>
                    <option value="Full-Time (Penuh Waktu)">Full-Time (Penuh Waktu)</option>
                    <option value="Part-Time (Paruh Waktu)">Part-Time (Paruh Waktu)</option>
                    <option value="Kontrak / Freelance">Kontrak / Freelance</option>
                    <option value="Magang (Internship)">Magang (Internship)</option>
                    <option value="manual">-- (Isi Manual) --</option>
                </select>
                <input type="text" id="jenis_kebutuhan_manual" name="Jenis Kebutuhan (Manual)" class="hidden-input" placeholder="Ketik jenis kerja di sini...">
            </div>

            <div class="form-group">
                <label>Estimasi Gaji 💰</label>
                <select id="gaji_select" name="Kategori Gaji" required>
                    <option value="" disabled selected>-- Pilih Kategori Gaji --</option>
                    <option value="Gaji Tidak Di Sebutkan">Gaji Tidak Di Sebutkan</option>
                    <option value="Gaji bulanan">Gaji bulanan</option>
                    <option value="Gaji mingguan">Gaji mingguan</option>
                    <option value="Gaji harian">Gaji harian</option>
                    <option value="Gaji persen">Gaji persen</option>
                    <option value="Gaji isi manual">Gaji isi manual</option>
                </select>
                <input type="text" id="gaji_detail" name="Detail Gaji" class="hidden-input" placeholder="Masukkan jumlah atau keterangan gaji...">
            </div>

            <div class="form-group">
                <label>Kualifikasi / Persyaratan 📑</label>
                <textarea name="Kualifikasi" rows="5" placeholder="Contoh:&#10;- Pria/Wanita, maks. 25 tahun&#10;- Min. SMA/SMK" required></textarea>
            </div>

            <div class="form-group">
                <label>Alamat / Penempatan 📍</label>
                <input type="text" name="Alamat Perusahaan" placeholder="Contoh: Jl. Ahmad Yani No. 45, Kendari" required>
            </div>

            <button type="submit" id="btnKirim">Kirim Info Loker</button>
        </form>
        
        <div id="statusMessage" class="status-box"></div>

        <div id="successButtons" class="success-buttons" style="display: none;">
            <a href="https://whatsapp.com/channel/0029VajH5Wu3QxRx0NTwWm0V" target="_blank" class="btn-action btn-wa">
                🟢 Gabung Saluran WhatsApp
            </a>
            <a href="#" class="btn-action btn-more" id="btnMoreLowongan">
                🔍 Lihat Lebih Banyak Lowongan
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
