<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>FB - Pasang Lowongan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: white; max-width: 550px; width: 100%; padding: 30px; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h2 { color: #2c3e66; text-align: center; margin-bottom: 8px; }
        .sub { color: #666; text-align: center; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 12px; font-size: 14px; background: #fafafa; }
        .hidden-input { display: none; margin-top: 8px; }
        button { width: 100%; padding: 14px; background: #2c3e66; color: white; border: none; border-radius: 40px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .alert { margin-top: 15px; padding: 12px; border-radius: 12px; text-align: center; display: none; }
        .success { display: block; background: #d4edda; color: #155724; }
    </style>
</head>
<body>
<div class="container">
    <h2>📢 Pasang Lowongan (Organ)</h2>
    <p class="sub">Data akan tersimpan & muncul di Data Center</p>
    <form id="lokerForm">
        <div class="form-group">
            <label>📧 Email Perusahaan</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>🏢 Nama Perusahaan</label>
            <input type="text" name="perusahaan" required>
        </div>
        <div class="form-group">
            <label>💼 Posisi</label>
            <input type="text" name="posisi" required>
        </div>
        <div class="form-group">
            <label>📍 Lokasi</label>
            <input type="text" name="lokasi" required>
        </div>
        <div class="form-group">
            <label>🛠️ Jenis Pekerjaan</label>
            <select id="jenisSelect">
                <option value="Full-Time">Full-Time</option>
                <option value="Part-Time">Part-Time</option>
                <option value="Kontrak">Kontrak</option>
                <option value="Magang">Magang</option>
                <option value="manual">-- Isi Manual --</option>
            </select>
            <input type="text" id="jenisManual" class="hidden-input" placeholder="Tulis jenis">
        </div>
        <div class="form-group">
            <label>💰 Estimasi Gaji</label>
            <select id="gajiSelect">
                <option value="Tidak disebutkan">Tidak disebutkan</option>
                <option value="Bulanan">Bulanan</option>
                <option value="Mingguan">Mingguan</option>
                <option value="Harian">Harian</option>
                <option value="Persen">Persentase</option>
            </select>
            <input type="text" id="gajiDetail" class="hidden-input" placeholder="Nominal/keterangan">
        </div>
        <div class="form-group">
            <label>📑 Kualifikasi / Deskripsi</label>
            <textarea name="deskripsi" rows="4" required></textarea>
        </div>
        <button type="submit">Kirim Lowongan</button>
    </form>
    <div id="alertBox" class="alert"></div>
    <div style="text-align: center; margin-top: 15px;">
        <a href="../data-center/" target="_blank">🔍 Buka Data Center (Otak)</a>
    </div>
</div>

<script>
    const form = document.getElementById('lokerForm');
    const alertBox = document.getElementById('alertBox');
    const jenisSelect = document.getElementById('jenisSelect');
    const jenisManual = document.getElementById('jenisManual');
    const gajiSelect = document.getElementById('gajiSelect');
    const gajiDetail = document.getElementById('gajiDetail');

    jenisSelect.addEventListener('change', () => {
        if (jenisSelect.value === 'manual') {
            jenisManual.style.display = 'block';
            jenisManual.required = true;
        } else {
            jenisManual.style.display = 'none';
            jenisManual.required = false;
        }
    });
    gajiSelect.addEventListener('change', () => {
        if (gajiSelect.value !== 'Tidak disebutkan') {
            gajiDetail.style.display = 'block';
            gajiDetail.required = true;
        } else {
            gajiDetail.style.display = 'none';
            gajiDetail.required = false;
        }
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        let jenis = jenisSelect.value;
        if (jenis === 'manual') jenis = jenisManual.value.trim();
        let gaji = gajiSelect.value;
        if (gaji !== 'Tidak disebutkan') gaji = gaji + ': ' + gajiDetail.value.trim();

        const lowonganBaru = {
            id: Date.now(),
            email: form.email.value.trim(),
            perusahaan: form.perusahaan.value.trim(),
            posisi: form.posisi.value.trim(),
            lokasi: form.lokasi.value.trim(),
            jenis: jenis,
            gaji: gaji,
            deskripsi: form.deskripsi.value.trim(),
            tanggal: new Date().toLocaleString('id-ID')
        };

        // Ambil data lama dari localStorage
        let daftar = localStorage.getItem('lowonganOtak');
        daftar = daftar ? JSON.parse(daftar) : [];
        daftar.unshift(lowonganBaru);
        if (daftar.length > 200) daftar = daftar.slice(0, 200);
        localStorage.setItem('lowonganOtak', JSON.stringify(daftar));

        alertBox.className = 'alert success';
        alertBox.innerText = '✅ Lowongan tersimpan! Lihat di Data Center.';
        form.reset();
        jenisManual.style.display = 'none';
        gajiDetail.style.display = 'none';
        jenisSelect.value = 'Full-Time';
        gajiSelect.value = 'Tidak disebutkan';

        setTimeout(() => { alertBox.style.display = 'none'; alertBox.className = 'alert'; }, 3000);
    });
</script>
</body>
</html>
