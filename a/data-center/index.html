<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Data Center - Loker Kendari</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; padding: 16px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 1.8rem; text-align: center; color: #2c3e66; margin-bottom: 6px; }
        .sub { text-align: center; font-size: 0.8rem; color: #666; margin-bottom: 24px; }

        /* Daftar lowongan (baris) */
        .lowongan-list { background: white; border-radius: 24px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .row { display: flex; flex-wrap: wrap; align-items: center; padding: 16px; border-bottom: 1px solid #e9ecef; cursor: pointer; transition: background 0.2s; gap: 8px; }
        .row:hover { background: #f8f9fc; }
        .email { flex: 2; min-width: 140px; font-weight: 600; color: #007bff; font-size: 0.75rem; word-break: break-all; }
        .perusahaan-posisi { flex: 3; min-width: 160px; font-size: 0.85rem; font-weight: 500; color: #333; }
        .lokasi { flex: 2; min-width: 120px; font-size: 0.75rem; color: #6c757d; }
        .tanggal { flex: 1; min-width: 80px; font-size: 0.7rem; color: #6c757d; }

        /* Kartu detail */
        .detail-card { background: #fff8e7; border-left: 5px solid #ff9800; margin-top: 24px; padding: 20px; border-radius: 24px; display: none; }
        .detail-card h3 { color: #e67e22; margin-bottom: 16px; font-size: 1.2rem; }
        .detail-row { margin-bottom: 12px; font-size: 0.85rem; display: flex; flex-wrap: wrap; gap: 4px; }
        .detail-label { font-weight: 700; width: 130px; flex-shrink: 0; color: #555; }
        .detail-value { color: #333; flex: 1; word-break: break-word; }

        .empty { text-align: center; padding: 48px 20px; background: white; border-radius: 24px; color: #888; font-size: 0.9rem; }
        .btn-group { display: flex; justify-content: center; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
        .btn-back, .btn-sample { padding: 12px 24px; border-radius: 40px; font-weight: bold; text-decoration: none; display: inline-block; border: none; cursor: pointer; font-size: 0.85rem; text-align: center; }
        .btn-back { background: #2c3e66; color: white; }
        .btn-sample { background: #27ae60; color: white; }
        footer { text-align: center; margin-top: 30px; font-size: 0.7rem; color: #888; }

        /* Responsive: ponsel */
        @media (max-width: 640px) {
            body { padding: 12px; }
            .row { flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; }
            .email, .perusahaan-posisi, .lokasi, .tanggal { width: 100%; }
            .detail-row { flex-direction: column; }
            .detail-label { width: 100%; margin-bottom: 4px; }
            h1 { font-size: 1.4rem; }
            .btn-back, .btn-sample { padding: 10px 18px; font-size: 0.8rem; width: auto; }
        }
        @media (max-width: 480px) {
            .container { padding: 0; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 Data Center Lowongan</h1>
    <p class="sub">Tampilan responsif untuk ponsel & desktop</p>
    <div id="listContainer" class="lowongan-list"></div>
    <div id="detailCard" class="detail-card"></div>
    <div class="btn-group">
        <a href="../fb/" class="btn-back">+ Pasang Lowongan</a>
        <button id="btnSample" class="btn-sample">📋 Tambah Contoh</button>
    </div>
    <footer>Data tersimpan di browser • Tap baris untuk detail</footer>
</div>

<script>
    let daftarLowongan = [];
    const listContainer = document.getElementById('listContainer');
    const detailCard = document.getElementById('detailCard');

    function simpan() { localStorage.setItem('lowonganOtak', JSON.stringify(daftarLowongan)); }
    function muat() {
        const stored = localStorage.getItem('lowonganOtak');
        daftarLowongan = stored ? JSON.parse(stored) : [];
        renderList();
    }
    function renderList() {
        if (!daftarLowongan.length) {
            listContainer.innerHTML = '<div class="empty">✨ Belum ada lowongan. Kirim dari halaman Pasang Lowongan atau klik "Tambah Contoh".</div>';
            detailCard.style.display = 'none';
            return;
        }
        let html = '';
        daftarLowongan.forEach((item, idx) => {
            let tgl = item.tanggal ? item.tanggal.split(' ')[0] : '-';
            html += `
                <div class="row" data-index="${idx}">
                    <div class="email">${escapeHtml(item.email || '-')}</div>
                    <div class="perusahaan-posisi">${escapeHtml(item.perusahaan || '-')} - ${escapeHtml(item.posisi || '-')}</div>
                    <div class="lokasi">📍 ${escapeHtml(item.lokasi || '-')}</div>
                    <div class="tanggal">📅 ${escapeHtml(tgl)}</div>
                </div>
            `;
        });
        listContainer.innerHTML = html;
        document.querySelectorAll('.row').forEach(row => {
            row.addEventListener('click', () => {
                const idx = parseInt(row.dataset.index);
                tampilkanDetail(idx);
            });
        });
    }
    function tampilkanDetail(idx) {
        const item = daftarLowongan[idx];
        if (!item) return;
        detailCard.style.display = 'block';
        detailCard.innerHTML = `
            <h3>🔍 Detail Lowongan</h3>
            <div class="detail-row"><span class="detail-label">Perusahaan:</span><span class="detail-value">${escapeHtml(item.perusahaan || '-')}</span></div>
            <div class="detail-row"><span class="detail-label">Posisi:</span><span class="detail-value">${escapeHtml(item.posisi || '-')}</span></div>
            <div class="detail-row"><span class="detail-label">Lokasi:</span><span class="detail-value">${escapeHtml(item.lokasi || '-')}</span></div>
            <div class="detail-row"><span class="detail-label">Deskripsi:</span><span class="detail-value">${escapeHtml(item.deskripsi || '-').replace(/\n/g, '<br>')}</span></div>
            <div class="detail-row"><span class="detail-label">Email:</span><span class="detail-value">${escapeHtml(item.email || '-')}</span></div>
            <div class="detail-row"><span class="detail-label">Jenis:</span><span class="detail-value">${escapeHtml(item.jenis || '-')}</span></div>
            <div class="detail-row"><span class="detail-label">Gaji:</span><span class="detail-value">${escapeHtml(item.gaji || '-')}</span></div>
            <div class="detail-row"><span class="detail-label">Tanggal:</span><span class="detail-value">${escapeHtml(item.tanggal || '-')}</span></div>
        `;
        detailCard.scrollIntoView({ behavior: 'smooth' });
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    document.getElementById('btnSample').addEventListener('click', () => {
        const contoh = {
            email: 'hrd@demo.com',
            perusahaan: 'PT Responsif Nusantara',
            posisi: 'UI/UX Designer',
            lokasi: 'Kendari, Sultra',
            jenis: 'Full-Time',
            gaji: 'Bulanan: 5.000.000',
            deskripsi: '- Pengalaman 2 tahun\n- Portfolio desain\n- Siap kerja hybrid',
            tanggal: new Date().toLocaleString('id-ID')
        };
        daftarLowongan.unshift(contoh);
        if (daftarLowongan.length > 200) daftarLowongan.pop();
        simpan();
        renderList();
    });
    muat();
</script>
</body>
</html>
