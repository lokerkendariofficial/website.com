<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>User Panel - Loker Kendari (Hamburger)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background: #f8fafc; }
    .header {
      background: #0e7490;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .hamburger {
      background: none;
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .logo { font-weight: bold; font-size: 1.2rem; }
    .menu-overlay {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: white;
      box-shadow: 2px 0 8px rgba(0,0,0,0.15);
      transition: left 0.3s;
      z-index: 1001;
      overflow-y: auto;
    }
    .menu-overlay.open { left: 0; }
    .menu-overlay .close-btn { text-align: right; padding: 12px; font-size: 1.5rem; cursor: pointer; }
    .menu-overlay a {
      display: block;
      padding: 12px 20px;
      text-decoration: none;
      color: #1e293b;
      border-bottom: 1px solid #e2e8f0;
    }
    .menu-overlay a:hover { background: #f1f5f9; color: #0a5b8c; }
    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
    }
    .backdrop.show { display: block; }
    .content-area { padding: 20px; max-width: 1280px; margin: 0 auto; }
    iframe {
      width: 100%;
      height: calc(100vh - 70px);
      border: none;
      background: white;
      border-radius: 20px;
    }
    @media (max-width: 640px) { .content-area { padding: 12px; } }
  </style>
  <script src="../auth/config.js"></script>
  <script src="../auth/session.js"></script>
  <script src="../auth/rules.js"></script>
  <script src="../auth/security.js"></script>
  <script src="../auth/account.js"></script>
  <script src="../auth/guard.js"></script>
  <script src="../auth/init.js"></script>
</head>
<body>
<script>
  if (!guard('user.html')) {}
</script>
<div class="header">
  <button class="hamburger" id="hamburgerBtn">☰</button>
  <div class="logo">👤 Loker Kendari (User)</div>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="menu-overlay" id="menuOverlay">
  <div class="close-btn" id="closeMenuBtn">&times;</div>
  <a href="#" data-page="beranda">🏠 Beranda</a>
  <a href="#" data-page="pasang">📝 Pasang Iklan</a>
  <a href="#" data-page="profil">👤 Profil</a>
  <a href="#" data-page="logout">🚪 Kembali ke Beranda</a>
</div>
<div class="content-area">
  <iframe id="mainFrame" src="beranda.html"></iframe>
</div>
<script>
  const hamburger = document.getElementById('hamburgerBtn');
  const menu = document.getElementById('menuOverlay');
  const backdrop = document.getElementById('backdrop');
  const closeBtn = document.getElementById('closeMenuBtn');
  const iframe = document.getElementById('mainFrame');

  function openMenu() { menu.classList.add('open'); backdrop.classList.add('show'); }
  function closeMenu() { menu.classList.remove('open'); backdrop.classList.remove('show'); }
  hamburger.addEventListener('click', openMenu);
  closeBtn.addEventListener('click', closeMenu);
  backdrop.addEventListener('click', closeMenu);

  function loadPage(url) { iframe.src = url; closeMenu(); }
  document.querySelectorAll('.menu-overlay a').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const page = link.getAttribute('data-page');
      if (page === 'beranda') loadPage('beranda.html');
      else if (page === 'pasang') loadPage('pasang.html');
      else if (page === 'profil') loadPage('profil.html');
      else if (page === 'logout') logoutUnique();
    });
  });
</script>
</body>
</html>
