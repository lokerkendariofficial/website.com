<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>User Dashboard - Loker Kendari</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f7fb; }
    .header {
      background: #0e7490;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo { font-weight: bold; font-size: 1.2rem; }
    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      padding: 5px 10px;
      border-radius: 20px;
    }
    .nav-links a:hover { background: rgba(255,255,255,0.2); }
    .content-area { padding: 20px; }
    iframe {
      width: 100%;
      height: calc(100vh - 80px);
      border: none;
      background: white;
      border-radius: 16px;
    }
    @media (max-width: 640px) {
      .header { flex-direction: column; text-align: center; }
      .nav-links a { margin: 0 10px; display: inline-block; }
    }
  </style>
  <!-- Load auth modules -->
  <script src="../auth/config.js"></script>
  <script src="../auth/session.js"></script>
  <script src="../auth/rules.js"></script>
  <script src="../auth/security.js"></script>
  <script src="../auth/account.js"></script>
  <script src="../auth/guard.js"></script>
  <script src="../auth/init.js"></script>
</head>
<body>
<script>
  if (!guard('user.html')) {
    // redirect terjadi di guard
  }
</script>
<div class="header">
  <div class="logo">👤 User Panel - Loker Kendari</div>
  <div class="nav-links">
    <a href="#" onclick="loadPage('beranda.html')">🏠 Beranda</a>
    <a href="#" onclick="loadPage('pasang.html')">📝 Pasang Iklan</a>
    <a href="#" onclick="loadPage('profil.html')">👤 Profil</a>
    <a href="#" onclick="logoutUnique()">🚪 Kembali ke Beranda</a>
  </div>
</div>
<div class="content-area">
  <iframe id="mainFrame" src="beranda.html"></iframe>
</div>
<script>
  function loadPage(url) {
    document.getElementById('mainFrame').src = url;
  }
</script>
</body>
</html>
