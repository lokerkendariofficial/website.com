<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda Lowongan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #ffffff;
      padding: 0;
      margin: 0;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem;
    }
    .header h1 {
      font-size: 1.8rem;
      color: #0a5b8c;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .search-wrapper {
      max-width: 480px;
      margin: 0 auto 1.5rem auto;
    }
    .search-box {
      display: flex;
      border: 1px solid #cbd5e1;
      border-radius: 60px;
      background: white;
      overflow: hidden;
    }
    .search-box input {
      flex: 1;
      padding: 10px 18px;
      border: none;
      outline: none;
      font-size: 0.9rem;
    }
    .search-box button {
      background: #0a5b8c;
      border: none;
      color: white;
      padding: 0 20px;
      cursor: pointer;
    }
    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .chip {
      background: #e2e8f0;
      padding: 5px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .chip.active {
      background: #0a5b8c;
      color: white;
    }
    .job-count {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #475569;
    }
    .job-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .job-card {
      background: white;
      border-radius: 20px;
      padding: 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      transition: 0.2s;
    }
    .job-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .job-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0a5b8c;
      margin-bottom: 4px;
    }
    .job-company {
      color: #334155;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
    }
    .job-details {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 8px 0;
      font-size: 0.8rem;
      color: #475569;
    }
    .job-details i {
      width: 18px;
      color: #0a5b8c;
    }
    .job-desc {
      font-size: 0.75rem;
      color: #64748b;
      margin: 10px 0;
    }
    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }
    .btn-detail {
      background: #0a5b8c;
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-container {
      background: white;
      width: 90%;
      max-width: 650px;
      max-height: 85vh;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      background: #0a5b8c;
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: white;
    }
    .modal-body {
      padding: 1.2rem;
      overflow-y: auto;
    }
    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.7rem;
      color: #94a3b8;
      padding: 1rem;
    }
    @media (max-width: 640px) {
      .job-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script src="../auth/session.js"></script>
  <script src="../auth/account.js"></script>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Lowongan Terbaru</h1>
  </div>
  <div class="search-wrapper">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari judul atau perusahaan...">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
  </div>
  <div class="categories" id="categoriesContainer"></div>
  <div class="job-count" id="jobCountDisplay">Memuat lowongan...</div>
  <div class="job-grid" id="jobList"></div>
  <div class="footer">© Loker Kendari Official</div>
</div>
<div id="detailModal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2>Detail Lowongan</h2>
      <button class="modal-close" id="closeModalBtn">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  // Global data lowongan (salin dari script.js atau gunakan langsung)
  let jobsData = [];
  let currentCategory = "all";
  let searchKeyword = "";

  function initJobsData() {
    const stored = localStorage.getItem('lokerData');
    if (stored && JSON.parse(stored).length > 0) {
      jobsData = JSON.parse(stored);
    } else {
      jobsData = [
        { id: 1, title: "Digital Marketing", company: "Kreatif Agency", location: "Kendari", type: "Fulltime", salary: "5jt - 8jt", category: "marketing", desc: "SEO, sosial media.", address: "Kendari", qualification: "Berpengalaman", contact: "WA: 08123456789" }
      ];
      localStorage.setItem('lokerData', JSON.stringify(jobsData));
    }
    jobsData = jobsData.map(j => { if (!j.category) j.category = "lainnya"; return j; });
  }

  function getUniqueCategories() {
    const cats = new Set();
    jobsData.forEach(j => cats.add(j.category));
    return Array.from(cats).sort();
  }

  function renderCategories() {
    const container = document.getElementById('categoriesContainer');
    if (!container) return;
    const cats = getUniqueCategories();
    let html = `<div class="chip ${currentCategory === 'all' ? 'active' : ''}" data-cat="all">Semua</div>`;
    const displayMap = { it: "IT & Teknologi", marketing: "Pemasaran", admin: "Administrasi", education: "Pendidikan", lainnya: "Lainnya" };
    cats.forEach(c => {
      let display = displayMap[c] || c.charAt(0).toUpperCase() + c.slice(1);
      html += `<div class="chip ${currentCategory === c ? 'active' : ''}" data-cat="${c}">${display}</div>`;
    });
    container.innerHTML = html;
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        currentCategory = chip.dataset.cat;
        renderCategories();
        renderJobs();
      });
    });
  }

  function renderJobs() {
    let filtered = [...jobsData];
    if (currentCategory !== "all") filtered = filtered.filter(j => j.category === currentCategory);
    if (searchKeyword.trim()) {
      const kw = searchKeyword.toLowerCase();
      filtered = filtered.filter(j => j.title.toLowerCase().includes(kw) || j.company.toLowerCase().includes(kw));
    }
    const container = document.getElementById('jobList');
    const countSpan = document.getElementById('jobCountDisplay');
    if (!container) return;
    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:2rem;">Tidak ada lowongan yang cocok.</div>';
      countSpan.innerText = '0 lowongan';
      return;
    }
    countSpan.innerText = `${filtered.length} lowongan ditemukan`;
    container.innerHTML = filtered.map(job => `
      <div class="job-card">
        <div class="job-title">${escapeHtml(job.title)}</div>
        <div class="job-company"><i class="fas fa-building"></i> ${escapeHtml(job.company)}</div>
        <div class="job-details">
          <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location)}</span>
          <span><i class="fas fa-clock"></i> ${escapeHtml(job.type)}</span>
          <span><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary)}</span>
        </div>
        <div class="job-desc">${escapeHtml(job.desc)}</div>
        <div class="card-footer">
          <button class="btn-detail" data-id="${job.id}">Lihat Selengkapnya</button>
        </div>
      </div>
    `).join('');
    document.querySelectorAll('.btn-detail').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const job = jobsData.find(j => j.id == id);
        if (job) showModal(job);
      });
    });
  }

  function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[m]); }

  function showModal(job) {
    const modal = document.getElementById('detailModal');
    const body = document.getElementById('modalBody');
    body.innerHTML = `
      <div><strong>${escapeHtml(job.company)}</strong> - ${escapeHtml(job.title)}</div>
      <div><strong>Lokasi:</strong> ${escapeHtml(job.location)}</div>
      <div><strong>Tipe:</strong> ${escapeHtml(job.type)}</div>
      <div><strong>Gaji:</strong> ${escapeHtml(job.salary)}</div>
      <div><strong>Alamat:</strong> ${escapeHtml(job.address || 'Tidak tersedia')}</div>
      <div><strong>Kualifikasi:</strong> ${escapeHtml(job.qualification || 'Tidak ada')}</div>
      <div><strong>Deskripsi:</strong> ${escapeHtml(job.desc)}</div>
      <div><strong>Kontak:</strong> ${escapeHtml(job.contact || 'Tidak tersedia')}</div>
    `;
    modal.classList.add('active');
  }

  function bindSearchEvents() {
    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    if (searchBtn) searchBtn.addEventListener('click', () => { searchKeyword = searchInput.value.trim(); renderJobs(); });
    if (searchInput) searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchBtn.click(); });
  }

  initJobsData();
  renderCategories();
  renderJobs();
  bindSearchEvents();

  const modal = document.getElementById('detailModal');
  const closeBtn = document.getElementById('closeModalBtn');
  if (closeBtn) closeBtn.onclick = () => modal.classList.remove('active');
  modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };
</script>
</body>
</html>
