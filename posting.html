<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pasang Iklan Lowongan</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>
<div class="container">
    <h2>Pasang Iklan Lowongan</h2>
    <form id="postForm">
        <input type="text" id="title" placeholder="Judul Lowongan" required>
        <input type="text" id="company" placeholder="Perusahaan" required>
        <input type="text" id="location" placeholder="Lokasi" required>
        <select id="type"><option>Fulltime</option><option>Parttime</option><option>Kontrak</option><option>Remote</option></select>
        <select id="category"><option value="it">IT</option><option value="marketing">Marketing</option><option value="admin">Administrasi</option><option value="education">Pendidikan</option><option value="lainnya">Lainnya</option></select>
        <input type="text" id="salary" placeholder="Gaji">
        <textarea id="desc" placeholder="Deskripsi" rows="4"></textarea>
        <button type="submit">Kirim Iklan</button>
    </form>
</div>
<script>
    const user = getCurrentUser();
    if (!user) {
        alert('Anda harus login terlebih dahulu.');
        window.location.href = 'login.html';
    }
    document.getElementById('postForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const newJob = {
            id: Date.now(),
            title: document.getElementById('title').value,
            company: document.getElementById('company').value,
            location: document.getElementById('location').value,
            type: document.getElementById('type').value,
            category: document.getElementById('category').value,
            salary: document.getElementById('salary').value || 'Nego',
            desc: document.getElementById('desc').value,
            userId: user.id,
            userName: user.nama,
            status: 'pending'
        };
        let pending = JSON.parse(localStorage.getItem('pendingIklan') || '[]');
        pending.unshift(newJob);
        localStorage.setItem('pendingIklan', JSON.stringify(pending));
        alert('Iklan terkirim! Menunggu konfirmasi admin.');
        e.target.reset();
    });
</script>
</body>
</html>
