<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasang Iklan - Loker Kendari</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="posting.css">
</head>
<body>
<div class="post-card">
  <h2><i class="fas fa-paper-plane"></i> Pasang Iklan Lowongan</h2>
  <p class="sub">Iklan Anda akan ditampilkan setelah diverifikasi admin.</p>
  <form id="postForm">
    <div class="form-row">
      <div class="form-group"><label>Judul Lowongan</label><input type="text" id="title" required></div>
      <div class="form-group"><label>Nama Perusahaan</label><input type="text" id="company" required></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Lokasi</label><input type="text" id="location" required></div>
      <div class="form-group"><label>Tipe</label><select id="type"><option>Fulltime</option><option>Parttime</option><option>Kontrak</option><option>Remote</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Kategori</label><select id="category"><option value="it">IT</option><option value="marketing">Marketing</option><option value="admin">Administrasi</option><option value="education">Pendidikan</option><option value="lainnya">Lainnya</option></select></div>
      <div class="form-group"><label>Gaji</label><input type="text" id="salary" placeholder="Nego"></div>
    </div>
    <div class="form-group full-width"><label>Deskripsi</label><textarea id="desc" rows="4" required></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Alamat (opsional)</label><input type="text" id="address"></div>
      <div class="form-group"><label>Kualifikasi (opsional)</label><input type="text" id="qualification"></div>
    </div>
    <div class="form-group full-width"><label>Kontak (opsional)</label><input type="text" id="contact"></div>
    <button type="submit">Kirim Iklan</button>
  </form>
  <div class="logout-link"><a href="#" id="logoutBtn">🚪 Logout</a></div>
</div>
<script src="auth.js"></script>
<script src="posting.js"></script>
</body>
</html>
