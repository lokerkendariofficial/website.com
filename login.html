<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Loker Kendari</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-card">
  <h1>Loker Kendari</h1>
  <p class="sub">Login dengan ID dan Password</p>
  <div class="form-group">
    <input type="text" id="loginId" placeholder="ID (900900 / 9090 / 9091)" autocomplete="off">
  </div>
  <div class="form-group">
    <input type="password" id="loginPassword" placeholder="Password">
  </div>
  <button id="loginBtn">Masuk</button>
  <div id="loginError" class="error"></div>
  <div class="info">
    <p>Akun default:</p>
    <ul>
      <li>Pemilik: 900900 / 900900</li>
      <li>Admin: 9090 / 9090</li>
      <li>User: 9091 / 9091</li>
    </ul>
  </div>
</div>
<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
