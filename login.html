<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register - Loker Kendari</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-card">
  <h1>Loker Kendari</h1>
  <div class="toggle-buttons">
    <button id="showLogin" class="active">Login</button>
    <button id="showRegister">Register</button>
  </div>
  <div id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button id="loginBtn">Masuk</button>
    <div id="loginError" class="error"></div>
  </div>
  <div id="registerForm" style="display:none">
    <input type="text" id="regNama" placeholder="Nama Lengkap">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Password">
    <button id="registerBtn">Daftar</button>
    <div id="registerError" class="error"></div>
  </div>
</div>
<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
