<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - Loker Kendari</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui; background: linear-gradient(135deg, #0a5b8c 0%, #0e7490 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .card { background: white; border-radius: 32px; padding: 2rem; width: 350px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 40px; border: 1px solid #ccc; }
    button { background: #0a5b8c; color: white; border: none; padding: 12px; border-radius: 40px; width: 100%; cursor: pointer; }
    .error { color: red; margin-top: 10px; }
  </style>
</head>
<body>
<div class="card">
  <h2>Login Loker Kendari</h2>
  <input type="text" id="username" placeholder="ID (900900/9090/9091)">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Masuk</button>
  <div id="error" class="error"></div>
</div>
<script src="auth.js"></script>
<script>
  document.getElementById('loginBtn').onclick = () => {
    const uname = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const res = login(uname, pass);
    if (res.success) {
      if (res.role === 'pemilik') window.location.href = 'owner/index.html';
      else if (res.role === 'admin') window.location.href = 'admin.html';
      else window.location.href = 'index.html';
    } else {
      document.getElementById('error').innerText = res.msg;
    }
  };
</script>
</body>
</html>
