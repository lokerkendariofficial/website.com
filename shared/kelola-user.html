<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kelola User</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        button { background: #0a5b8c; color: white; border: none; padding: 4px 12px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>Kelola User</h2>
    <div id="userList"></div>
</div>
<script>
    let users = JSON.parse(localStorage.getItem('users') || '[{"id":1,"nama":"Pemilik Utama","role":"pemilik","isOwner":true}]');
    function saveUsers() { localStorage.setItem('users', JSON.stringify(users)); }
    function render() {
        const container = document.getElementById('userList');
        let html = '<table><tr><th>ID</th><th>Nama</th><th>Role</th><th>Aksi</th></tr>';
        users.forEach(user => {
            html += `<tr>
                        <td>${user.id}</td>
                        <td>${user.nama}</td>
                        <td>${user.role}</td>
                        <td>${!user.isOwner ? `<button onclick="ubahRole(${user.id})">Ubah Role</button> <button onclick="hapusUser(${user.id})">Hapus</button>` : 'Pemilik'}</td>
                     </tr>`;
        });
        html += '</table>';
        container.innerHTML = html;
    }
    function ubahRole(id) {
        const user = users.find(u => u.id == id);
        if (user && !user.isOwner) {
            user.role = user.role === 'admin' ? 'user' : 'admin';
            saveUsers();
            render();
        }
    }
    function hapusUser(id) {
        users = users.filter(u => u.id != id);
        saveUsers();
        render();
    }
    render();
</script>
</body>
</html>
