<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Lowongan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        .detail-card { max-width: 800px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 24px; }
        button { background: #0a5b8c; color: white; border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; }
    </style>
</head>
<body>
<div class="detail-card" id="detailContainer"></div>
<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const jobs = JSON.parse(localStorage.getItem('lokerData') || '[]');
    const job = jobs.find(j => j.id == id);
    const container = document.getElementById('detailContainer');
    if (!job) container.innerHTML = '<p>Lowongan tidak ditemukan.</p>';
    else {
        container.innerHTML = `
            <h2>${escapeHtml(job.title)}</h2>
            <p><strong>${escapeHtml(job.company)}</strong></p>
            <p><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location)}</p>
            <p><i class="fas fa-clock"></i> ${escapeHtml(job.type)}</p>
            <p><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary)}</p>
            <p>${escapeHtml(job.desc)}</p>
            <button onclick="window.history.back()">Kembali</button>
        `;
    }
    function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
</script>
</body>
</html>
