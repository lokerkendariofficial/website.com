<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfirmasi Iklan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .job-card { margin-bottom: 1rem; background: white; padding: 1rem; border-radius: 16px; }
    button.approve { background: #10b981; margin-right: 0.5rem; color: white; border: none; padding: 6px 16px; border-radius: 40px; cursor: pointer; }
    button.reject { background: #ef4444; color: white; border: none; padding: 6px 16px; border-radius: 40px; cursor: pointer; }
  </style>
  <script src="../auth/session.js"></script>
  <script src="../auth/account.js"></script>
  <script src="../auth/security.js"></script>
</head>
<body>
<div class="container">
  <h2><i class="fas fa-check-circle"></i> Konfirmasi Iklan Pending</h2>
  <div id="pendingList"></div>
</div>
<script>
  const user = getCurrentUser();
  if (!user || !can('pending.baca', user.role)) {
    document.getElementById('pendingList').innerHTML = '<p style="color:red;">Akses ditolak. Anda tidak memiliki izin.</p>';
  } else {
    let pending = JSON.parse(localStorage.getItem('pendingIklan') || '[]');
    function loadPending() {
      pending = JSON.parse(localStorage.getItem('pendingIklan') || '[]');
      const container = document.getElementById('pendingList');
      if (pending.length === 0) {
        container.innerHTML = '<p>Tidak ada iklan menunggu konfirmasi.</p>';
        return;
      }
      container.innerHTML = pending.map(job => `
        <div class="job-card">
          <h3>${escapeHtml(job.title)}</h3>
          <p><strong>${escapeHtml(job.company)}</strong> - ${escapeHtml(job.location)}</p>
          <p><small>Diajukan oleh: ${escapeHtml(job.userName || 'Tidak diketahui')}</small></p>
          <button class="approve" data-id="${job.id}">✅ Setujui</button>
          <button class="reject" data-id="${job.id}">❌ Tolak</button>
        </div>
      `).join('');
      document.querySelectorAll('.approve').forEach(btn => btn.addEventListener('click', () => approve(btn.dataset.id)));
      document.querySelectorAll('.reject').forEach(btn => btn.addEventListener('click', () => reject(btn.dataset.id)));
    }
    function approve(id) {
      const job = pending.find(j => j.id == id);
      if (job) {
        let loker = JSON.parse(localStorage.getItem('lokerData') || '[]');
        delete job.status;
        job.uploadedAt = Date.now();
        loker.unshift(job);
        localStorage.setItem('lokerData', JSON.stringify(loker));
        pending = pending.filter(j => j.id != id);
        localStorage.setItem('pendingIklan', JSON.stringify(pending));
        addLog(user.id, user.nama, 'APPROVE', `Menyetujui iklan "${job.title}" dari ${job.company}`);
        alert('Iklan disetujui dan sudah tampil di beranda.');
        loadPending();
      }
    }
    function reject(id) {
      const job = pending.find(j => j.id == id);
      if (job) {
        pending = pending.filter(j => j.id != id);
        localStorage.setItem('pendingIklan', JSON.stringify(pending));
        addLog(user.id, user.nama, 'REJECT', `Menolak iklan "${job.title}" dari ${job.company}`);
        alert('Iklan ditolak.');
        loadPending();
      }
    }
    function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    loadPending();
  }
</script>
</body>
</html>
