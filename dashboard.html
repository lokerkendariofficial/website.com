<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script src="auth/config.js"></script>
  <script src="auth/session.js"></script>
  <script src="auth/rules.js"></script>
  <script src="auth/security.js"></script>
  <script src="auth/account.js"></script>
  <script src="auth/guard.js"></script>
</head>
<body>
<script>
  if (!requireValidSession()) {
    // redirect sudah terjadi
  } else {
    const user = getCurrentUser();
    if (user.role === 'pemilik') window.location.href = 'owner/owner.html';
    else if (user.role === 'admin') window.location.href = 'admin/admin.html';
    else window.location.href = 'user/user.html';
  }
</script>
</body>
</html>
