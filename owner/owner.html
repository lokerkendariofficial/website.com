<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Dashboard Pemilik - Loker Kendari</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <style>
    .dashboard-header { background: #0a5b8c; padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
    .hamburger { background: none; border: none; color: white; font-size: 1.8rem; cursor: pointer; }
    .menu-overlay { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: white; transition: left 0.3s; z-index: 1001; overflow-y: auto; }
    .menu-overlay.open { left: 0; }
    .menu-overlay .close-btn { text-align: right; padding: 12px; font-size: 1.5rem; cursor: pointer; }
    .backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; }
    .backdrop.show { display: block; }
    .content-area { padding: 20px; }
  </style>
</head>
<body>
<div class="dashboard-header">
  <button class="hamburger" id="hamburgerBtn">☰</button>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="menu-overlay" id="menuOverlay">
  <div class="close-btn" id="closeMenuBtn">&times;</div>
  <div id="menuContainer"></div> <!-- menu akan dimuat di sini -->
</div>
<div class="content-area" id="mainContent">
  <div id="jobList" class="job-grid"></div>
  <div id="jobCountDisplay" style="text-align:center; margin-top:1rem;"></div>
</div>
<div id="detailModal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header"><h2><i class="fas fa-briefcase"></i> Detail Lowongan</h2><button class="modal-close" id="closeModalBtn">&times;</button></div>
    <div class="modal-body" id="modalBody">Memuat...</div>
  </div>
</div>
<script src="../script.js"></script>
<script>
  // Memuat menu dari hamburger.html
  fetch('../hamburger.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('menuContainer').innerHTML = html;
      // Setelah menu dimuat, pasang event listener
      document.querySelectorAll('#menuContainer a').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const page = link.getAttribute('data-page');
          loadContent(page);
          closeMenu();
        });
      });
    });

  // Fungsi menu dan konten
  const hamburger = document.getElementById('hamburgerBtn');
  const menu = document.getElementById('menuOverlay');
  const backdrop = document.getElementById('backdrop');
  const closeMenuBtn = document.getElementById('closeMenuBtn');

  function openMenu() { menu.classList.add('open'); backdrop.classList.add('show'); }
  function closeMenu() { menu.classList.remove('open'); backdrop.classList.remove('show'); }
  hamburger.addEventListener('click', openMenu);
  closeMenuBtn.addEventListener('click', closeMenu);
  backdrop.addEventListener('click', closeMenu);

  function loadContent(page) {
    closeMenu();
    if (page === 'beranda') {
      renderJobs();
      document.getElementById('jobCountDisplay').style.display = 'block';
    } else if (page === 'logout') {
      window.location.href = '../index.html';
    } else {
      document.getElementById('jobList').innerHTML = `<div class="container"><h2>Halaman ${page}</h2><p>Fitur sedang dikembangkan.</p></div>`;
      document.getElementById('jobCountDisplay').style.display = 'none';
    }
  }

  initJobsData();
  renderJobs();

  const modal = document.getElementById('detailModal'), closeModalBtn = document.getElementById('closeModalBtn');
  closeModalBtn.onclick = () => modal.classList.remove('active');
  modal.onclick = e => { if(e.target === modal) modal.classList.remove('active'); };
</script>
</body>
</html>
