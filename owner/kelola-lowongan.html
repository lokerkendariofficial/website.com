<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Kelola Lowongan - Loker Kendari</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-gray-200">

<header class="bg-slate-800 border-b border-slate-700 px-4 py-2 flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center space-x-3">
        <button id="sidebarToggleBtn" class="text-white text-xl"><i class="fa-solid fa-bars"></i></button>
        <div class="flex items-center space-x-2"><i class="fa-solid fa-briefcase text-blue-400 text-xl"></i><span class="font-bold text-white text-lg">Loker Kendari</span><span class="text-xs text-blue-400 bg-blue-900/30 px-2 py-0.5 rounded">Official</span></div>
    </div>
    <div class="flex items-center space-x-4">
        <div class="hidden md:block relative"><input type="text" placeholder="Cepat..." class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-xs w-40 text-white"><i class="fa-solid fa-magnifying-glass absolute right-2 top-2 text-gray-400 text-xs"></i></div>
        <div class="flex items-center space-x-2 cursor-pointer hover:text-blue-300"><i class="fa-regular fa-bell"></i><span class="text-xs hidden sm:inline">Notifikasi</span></div>
        <div class="flex items-center space-x-2 cursor-pointer hover:text-blue-300"><i class="fa-regular fa-user"></i><span class="text-xs" id="userName">Pemilik</span></div>
        <button id="logoutBtn" class="bg-red-600/80 hover:bg-red-700 text-white text-xs px-3 py-1 rounded">Logout</button>
    </div>
</header>

<div class="bg-slate-800/50 border-b border-slate-700 px-4 py-2 flex flex-wrap items-center justify-between text-xs sticky top-12 z-10">
    <div class="flex items-center space-x-2"><span class="font-semibold text-gray-300 uppercase tracking-wider">Kelola Lowongan</span></div>
    <div class="flex items-center space-x-2"><button id="refreshBtn" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded"><i class="fa-solid fa-rotate"></i> Refresh</button></div>
</div>

<div class="flex flex-1 overflow-hidden relative">
    <aside id="sidebar" class="sidebar w-64 bg-slate-800 border-r border-slate-700 flex flex-col text-sm overflow-y-auto transition-all duration-300">
        <div class="p-3"><input type="text" placeholder="Cari menu..." class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-xs"></div>
        <nav class="flex-1">
            <div class="px-3 py-2 text-gray-400 font-semibold text-xs uppercase">Utama</div>
            <a href="utama.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-slate-700/50"><i class="fa-solid fa-chart-line w-5"></i> Dashboard</a>
            <a href="kelola-lowongan.html" class="sidebar-active flex items-center px-4 py-2 text-white bg-slate-700/30 border-l-4 border-blue-500"><i class="fa-regular fa-file-lines w-5"></i> Kelola Lowongan</a>
            <a href="konfirmasi-iklan.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-slate-700/50"><i class="fa-regular fa-clock w-5"></i> Konfirmasi Iklan</a>
            <a href="manajemen-user.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-slate-700/50"><i class="fa-solid fa-users w-5"></i> Manajemen User</a>
            <a href="laporan-statistik.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-slate-700/50"><i class="fa-solid fa-chart-simple w-5"></i> Laporan & Statistik</a>
            <div class="border-t border-slate-700 my-2"></div>
            <div class="px-3 py-2 text-gray-400 font-semibold text-xs uppercase">Pengaturan</div>
            <a href="pengaturan-sistem.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-slate-700/50"><i class="fa-solid fa-gear w-5"></i> Pengaturan Sistem</a>
            <a href="backup.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-slate-700/50"><i class="fa-solid fa-database w-5"></i> Backup/Restore</a>
            <a href="log-aktivitas.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-slate-700/50"><i class="fa-solid fa-list-check w-5"></i> Log Aktivitas</a>
        </nav>
    </aside>

    <main id="mainContent" class="flex-1 p-4 overflow-y-auto">
        <div class="bg-slate-800/50 border border-slate-700 rounded-lg p-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
                <h3 class="font-semibold text-white"><i class="fa-solid fa-briefcase mr-2 text-blue-400"></i> Semua Lowongan</h3>
                <button id="tambahLowonganBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1 rounded flex items-center gap-1"><i class="fa-solid fa-plus"></i> Tambah Lowongan</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="text-gray-400 border-b border-slate-700">
                        <tr><th class="text-left py-2">ID</th><th class="text-left py-2">Judul</th><th class="text-left py-2">Perusahaan</th><th class="text-left py-2">Lokasi</th><th class="text-left py-2">Tipe</th><th class="text-left py-2">Gaji</th><th class="text-left py-2">Aksi</th></tr>
                    </thead>
                    <tbody id="lowonganTableBody"><tr><td colspan="7" class="py-4 text-center text-gray-500">Memuat...</td></tr>
                </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Modal Tambah/Edit Lowongan -->
<div id="jobModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden">
    <div class="bg-slate-800 rounded-lg w-full max-w-lg p-5 border border-slate-600">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
            <h3 class="text-lg font-semibold text-white" id="modalTitle">Tambah Lowongan</h3>
            <button id="closeModalBtn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-times"></i></button>
        </div>
        <form id="jobForm">
            <input type="hidden" id="jobId" value="">
            <div class="mb-3"><label class="block text-xs text-gray-400 mb-1">Judul</label><input type="text" id="jobTitle" required class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white"></div>
            <div class="mb-3"><label class="block text-xs text-gray-400 mb-1">Perusahaan</label><input type="text" id="jobCompany" required class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white"></div>
            <div class="mb-3"><label class="block text-xs text-gray-400 mb-1">Lokasi</label><input type="text" id="jobLocation" required class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white"></div>
            <div class="mb-3"><label class="block text-xs text-gray-400 mb-1">Tipe</label><select id="jobType" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white"><option>Fulltime</option><option>Parttime</option><option>Kontrak</option><option>Remote</option></select></div>
            <div class="mb-3"><label class="block text-xs text-gray-400 mb-1">Kategori</label><select id="jobCategory" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white"><option value="it">IT</option><option value="marketing">Marketing</option><option value="admin">Administrasi</option><option value="education">Pendidikan</option><option value="lainnya">Lainnya</option></select></div>
            <div class="mb-3"><label class="block text-xs text-gray-400 mb-1">Gaji</label><input type="text" id="jobSalary" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white"></div>
            <div class="mb-3"><label class="block text-xs text-gray-400 mb-1">Deskripsi</label><textarea id="jobDesc" rows="3" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white"></textarea></div>
            <div class="flex justify-end gap-2"><button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-1 rounded text-white">Simpan</button><button type="button" id="cancelModalBtn" class="bg-slate-600 hover:bg-slate-500 px-4 py-1 rounded text-white">Batal</button></div>
        </form>
    </div>
</div>

<script src="../auth.js"></script>
<script src="script.js"></script>
<script>
    let lowongan = JSON.parse(localStorage.getItem('lokerData') || '[]');

    function renderLowongan() {
        const tbody = document.getElementById('lowonganTableBody');
        if (!lowongan.length) { tbody.innerHTML = '<tr><td colspan="7" class="py-4 text-center text-gray-500">Belum ada lowongan</td></tr>'; return; }
        let html = '';
        lowongan.forEach(job => {
            html += `<tr class="border-b border-slate-700/50 hover:bg-slate-700/30">
                <td class="py-2">${job.id}</td><td class="py-2">${escapeHtml(job.title)}</td><td class="py-2">${escapeHtml(job.company)}</td>
                <td class="py-2">${escapeHtml(job.location)}</td><td class="py-2">${escapeHtml(job.type)}</td><td class="py-2">${escapeHtml(job.salary)}</td>
                <td class="py-2"><button class="edit-job bg-blue-600/80 hover:bg-blue-700 text-white text-xs px-2 py-1 rounded mr-1" data-id="${job.id}"><i class="fa-regular fa-pen-to-square"></i> Edit</button><button class="delete-job bg-red-600/80 hover:bg-red-700 text-white text-xs px-2 py-1 rounded" data-id="${job.id}">Hapus</button></td>
            </tr>`;
        });
        tbody.innerHTML = html;
        document.querySelectorAll('.edit-job').forEach(btn => btn.addEventListener('click', () => editJob(parseInt(btn.dataset.id))));
        document.querySelectorAll('.delete-job').forEach(btn => btn.addEventListener('click', () => deleteJob(parseInt(btn.dataset.id))));
    }

    function deleteJob(id) {
        if (confirm('Hapus lowongan ini?')) {
            lowongan = lowongan.filter(j => j.id !== id);
            localStorage.setItem('lokerData', JSON.stringify(lowongan));
            renderLowongan();
            addLog(currentUser.id, currentUser.nama, 'DELETE_JOB', `Menghapus lowongan ID ${id}`);
        }
    }

    function editJob(id) {
        const job = lowongan.find(j => j.id === id);
        if (job) {
            document.getElementById('jobId').value = job.id;
            document.getElementById('jobTitle').value = job.title;
            document.getElementById('jobCompany').value = job.company;
            document.getElementById('jobLocation').value = job.location;
            document.getElementById('jobType').value = job.type;
            document.getElementById('jobCategory').value = job.category;
            document.getElementById('jobSalary').value = job.salary;
            document.getElementById('jobDesc').value = job.desc;
            document.getElementById('modalTitle').innerText = 'Edit Lowongan';
            document.getElementById('jobModal').classList.remove('hidden');
        }
    }

    document.getElementById('tambahLowonganBtn').addEventListener('click', () => {
        document.getElementById('jobForm').reset();
        document.getElementById('jobId').value = '';
        document.getElementById('modalTitle').innerText = 'Tambah Lowongan';
        document.getElementById('jobModal').classList.remove('hidden');
    });

    function closeModal() { document.getElementById('jobModal').classList.add('hidden'); }
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

    document.getElementById('jobForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('jobId').value;
        const newJob = {
            id: id ? parseInt(id) : Date.now(),
            title: document.getElementById('jobTitle').value,
            company: document.getElementById('jobCompany').value,
            location: document.getElementById('jobLocation').value,
            type: document.getElementById('jobType').value,
            category: document.getElementById('jobCategory').value,
            salary: document.getElementById('jobSalary').value || 'Nego',
            desc: document.getElementById('jobDesc').value,
            uploadedAt: Date.now()
        };
        if (id) {
            lowongan = lowongan.map(j => j.id === newJob.id ? newJob : j);
            addLog(currentUser.id, currentUser.nama, 'EDIT_JOB', `Mengedit lowongan ${newJob.title}`);
        } else {
            lowongan.unshift(newJob);
            addLog(currentUser.id, currentUser.nama, 'ADD_JOB', `Menambah lowongan ${newJob.title}`);
        }
        localStorage.setItem('lokerData', JSON.stringify(lowongan));
        renderLowongan();
        closeModal();
    });

    renderLowongan();
    document.getElementById('refreshBtn').addEventListener('click', () => { lowongan = JSON.parse(localStorage.getItem('lokerData') || '[]'); renderLowongan(); });
</script>
</body>
</html>
