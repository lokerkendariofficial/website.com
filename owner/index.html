<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Dashboard Pemilik - Loker Kendari</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
  <div class="header">
    <h1><i class="fas fa-crown"></i> Dashboard Pemilik</h1>
    <button id="logoutBtn" class="btn-logout">Logout</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><i class="fas fa-briefcase"></i><span id="totalLowongan">0</span><p>Total Lowongan</p></div>
    <div class="stat-card"><i class="fas fa-clock"></i><span id="totalPending">0</span><p>Iklan Pending</p></div>
    <div class="stat-card"><i class="fas fa-users"></i><span id="totalUser">0</span><p>Total User</p></div>
    <div class="stat-card"><i class="fas fa-paper-plane"></i><span id="totalLamaran">0</span><p>Lamaran Masuk</p></div>
  </div>

  <div class="section">
    <h2>⏳ Iklan Menunggu Konfirmasi</h2>
    <div id="pendingList" class="list-container"></div>
  </div>

  <div class="section">
    <h2>📋 Daftar Lowongan</h2>
    <div id="lowonganList" class="list-container"></div>
  </div>

  <div class="section">
    <h2>👥 Daftar User</h2>
    <div id="userList" class="list-container"></div>
  </div>

  <div class="section">
    <h2>📬 Daftar Lamaran</h2>
    <div id="lamaranList" class="list-container"></div>
  </div>
</div>
<script src="../auth.js"></script>
<script src="script.js"></script>
</body>
</html>
