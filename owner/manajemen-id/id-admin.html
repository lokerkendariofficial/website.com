<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Manajemen User - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-900 text-gray-200">
<div class="bg-slate-800/50 border border-slate-700 rounded-lg p-4">
    <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
        <h3 class="font-semibold text-white"><i class="fa-solid fa-user-tie mr-2 text-blue-400"></i> Daftar User (Role: Admin)</h3>
        <span id="totalCount" class="text-xs text-gray-400"></span>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-sm"><thead class="text-gray-400 border-b border-slate-700"><tr><th>ID</th><th>Nama</th><th>Username</th><th>Nomor HP</th><th>Role</th><th>Aksi</th></tr></thead><tbody id="userTableBody"><tr><td colspan="6" class="py-4 text-center text-gray-500">Memuat...</td></tr></tbody></table>
    </div>
</div>
<script src="../../../auth.js"></script>
<script>
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[m]); }
    const current = getCurrentUser();
    if (!current || (current.role !== 'pemilik' && current.role !== 'admin')) { alert('Akses ditolak'); window.location.href = '../../../index.html'; }
    let allUsers = [];
    function renderUsers() {
        const filtered = allUsers.filter(u => u.role === 'admin');
        const tbody = document.getElementById('userTableBody');
        if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="6" class="py-4 text-center text-gray-500">Tidak ada user dengan role admin</td></tr>'; document.getElementById('totalCount').innerText = '0 user'; return; }
        document.getElementById('totalCount').innerText = `${filtered.length} user (dari ${allUsers.length} total)`;
        let html = '';
        filtered.forEach(u => { html += `<tr class="border-b border-slate-700/50 hover:bg-slate-700/30"><td class="py-2">${u.id}</td><td class="py-2">${escapeHtml(u.nama)}</td><td class="py-2">${escapeHtml(u.username)}</td><td class="py-2">${u.nomorHp || '-'}</td><td class="py-2">${u.role}</td><td class="py-2"><button onclick="changeRole(${u.id})" class="bg-blue-600/80 hover:bg-blue-700 text-white text-xs px-2 py-1 rounded mr-1">Ubah Role</button><button onclick="deleteUser(${u.id})" class="bg-red-600/80 hover:bg-red-700 text-white text-xs px-2 py-1 rounded">Hapus</button></td></tr>`; });
        tbody.innerHTML = html;
    }
    window.changeRole = (userId) => {
        const user = allUsers.find(u => u.id === userId);
        if (!user || user.isOwner) return;
        const newRole = user.role === 'admin' ? 'user' : 'admin';
        if (confirm(`Ubah role user ini menjadi ${newRole}?`)) { updateUserRole(userId, newRole); refreshData(); }
    };
    window.deleteUser = (userId) => { if (confirm('Hapus user ini?')) { deleteUser(userId); refreshData(); } };
    function refreshData() { allUsers = getUsers(); renderUsers(); }
    refreshData();
    document.getElementById('refreshBtn')?.addEventListener('click', () => location.reload());
</script>
</body>
</html>
