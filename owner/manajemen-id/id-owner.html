<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Manajemen User - Pemilik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-900 text-gray-200">
<div class="bg-slate-800/50 border border-slate-700 rounded-lg p-4">
    <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
        <h3 class="font-semibold text-white"><i class="fa-solid fa-crown mr-2 text-yellow-400"></i> Daftar User (Role: Pemilik)</h3>
        <span id="totalCount" class="text-xs text-gray-400"></span>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="text-gray-400 border-b border-slate-700"><tr><th class="text-left py-2">ID</th><th class="text-left py-2">Nama</th><th class="text-left py-2">Username</th><th class="text-left py-2">Nomor HP</th><th class="text-left py-2">Role</th><th class="text-left py-2">Aksi</th></tr></thead>
            <tbody id="userTableBody"><tr><td colspan="6" class="py-4 text-center text-gray-500">Memuat...</td></tr></tbody>
        </table>
    </div>
</div>
<script src="../../../auth.js"></script>
<script>
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[m]); }
    const current = getCurrentUser();
    if (!current || (current.role !== 'pemilik' && current.role !== 'admin')) { alert('Akses ditolak'); window.location.href = '../../../index.html'; }
    let allUsers = [];
    function renderUsers() {
        const filtered = allUsers.filter(u => u.role === 'pemilik');
        const tbody = document.getElementById('userTableBody');
        if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="6" class="py-4 text-center text-gray-500">Tidak ada user dengan role pemilik</td></tr>'; document.getElementById('totalCount').innerText = '0 user'; return; }
        document.getElementById('totalCount').innerText = `${filtered.length} user (dari ${allUsers.length} total)`;
        let html = '';
        filtered.forEach(u => { html += `<tr class="border-b border-slate-700/50 hover:bg-slate-700/30"><td class="py-2">${u.id}</td><td class="py-2">${escapeHtml(u.nama)}</td><td class="py-2">${escapeHtml(u.username)}</td><td class="py-2">${u.nomorHp || '-'}</td><td class="py-2">${u.role}</td><td class="py-2"><span class="text-gray-500 text-xs">Pemilik</span></td></tr>`; });
        tbody.innerHTML = html;
    }
    function refreshData() { allUsers = getUsers(); renderUsers(); }
    refreshData();
    document.getElementById('refreshBtn')?.addEventListener('click', () => location.reload());
</script>
</body>
</html>
